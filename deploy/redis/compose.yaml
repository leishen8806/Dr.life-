services:
  redis-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:${CACHE_REDIS_HOST_PORT:-56379}:6379"]
  redis-state:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-56381}:6379"]
  redis-queue:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${QUEUE_REDIS_HOST_PORT:-56380}:6379"]
