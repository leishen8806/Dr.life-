# Install this file as a site include. The origin uses gzip only; Cloudflare
# performs browser-facing Brotli compression at the edge when supported.

server {
    listen 80;
    listen [::]:80;
    server_name settlecore.org;
    return 301 https://settlecore.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.settlecore.org;
    return 301 https://settlecore.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.settlecore.org;

    ssl_certificate     /etc/nginx/tls/settlecore-origin.crt;
    ssl_certificate_key /etc/nginx/tls/settlecore-origin.key;
    return 301 https://settlecore.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name settlecore.org;

    ssl_certificate     /etc/nginx/tls/settlecore-origin.crt;
    ssl_certificate_key /etc/nginx/tls/settlecore-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/settlecore/current;
    index index.html;
    autoindex off;
    absolute_redirect off;
    port_in_redirect off;

    include /etc/nginx/snippets/settlecore-security-headers.conf;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /_astro/ {
        include /etc/nginx/snippets/settlecore-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* "^/fonts/.+\.[a-f0-9]{8,}\.woff2$" {
        include /etc/nginx/snippets/settlecore-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        include /etc/nginx/snippets/settlecore-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/settlecore-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
