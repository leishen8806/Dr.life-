# Install this file as a site include; the global nginx.conf must load the
# Brotli dynamic modules supplied by the selected nginx package/image.

server {
    listen 80;
    listen [::]:80;
    server_name settlecore.org;
    return 301 https://settlecore.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.settlecore.org;
    return 301 https://settlecore.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.settlecore.org;

    ssl_certificate     /etc/nginx/tls/settlecore-origin.crt;
    ssl_certificate_key /etc/nginx/tls/settlecore-origin.key;
    return 301 https://settlecore.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name settlecore.org;

    ssl_certificate     /etc/nginx/tls/settlecore-origin.crt;
    ssl_certificate_key /etc/nginx/tls/settlecore-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/settlecore/current;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
