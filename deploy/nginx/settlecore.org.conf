# Backup-domain redirect. Keep the existing settlecore.org certificate so
# HTTPS requests can be redirected without a browser certificate error.

server {
    listen 80;
    listen [::]:80;
    server_name settlecore.org www.settlecore.org;
    return 301 https://drlifeplus.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name settlecore.org www.settlecore.org;

    ssl_certificate     /etc/nginx/tls/settlecore-origin.crt;
    ssl_certificate_key /etc/nginx/tls/settlecore-origin.key;
    return 301 https://drlifeplus.com$request_uri;
}
