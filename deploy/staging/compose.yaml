name: drlife-staging

services:
  api:
    image: drlife-api:${APP_RELEASE:-staging}
    env_file: ["${STAGING_ENV_FILE:-deploy/staging/env.example}"]
    environment:
      APP_ENV: staging
      MIGRATIONS_DIR: /migrations
      REDIS_URL: redis://:${REDIS_STATE_PASSWORD:?set REDIS_STATE_PASSWORD}@redis-state:6379/0
      QUEUE_REDIS_URL: redis://:${REDIS_QUEUE_PASSWORD:?set REDIS_QUEUE_PASSWORD}@redis-queue:6379/0
      CACHE_REDIS_URL: redis://:${REDIS_CACHE_PASSWORD:?set REDIS_CACHE_PASSWORD}@redis-cache:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis-state: { condition: service_healthy }
      redis-queue: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
    volumes: [../../backend/migrations:/migrations:ro]
    expose: ["8080"]
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1:8080/healthz'
  worker:
    image: drlife-api:${APP_RELEASE:-staging}
    env_file: ["${STAGING_ENV_FILE:-deploy/staging/env.example}"]
    environment:
      APP_ENV: staging
      MIGRATIONS_DIR: /migrations
      REDIS_URL: redis://:${REDIS_STATE_PASSWORD:?set REDIS_STATE_PASSWORD}@redis-state:6379/0
      QUEUE_REDIS_URL: redis://:${REDIS_QUEUE_PASSWORD:?set REDIS_QUEUE_PASSWORD}@redis-queue:6379/0
      CACHE_REDIS_URL: redis://:${REDIS_CACHE_PASSWORD:?set REDIS_CACHE_PASSWORD}@redis-cache:6379/0
    entrypoint: [/worker]
    depends_on: [postgres, redis-state, redis-queue]
    volumes: [../../backend/migrations:/migrations:ro]
  routefitmock:
    image: drlife-api:${APP_RELEASE:-staging}
    env_file: ["${STAGING_ENV_FILE:-deploy/staging/env.example}"]
    environment: { APP_ENV: staging }
    entrypoint: [/routefitmock]
  migrate:
    image: drlife-api:${APP_RELEASE:-staging}
    environment:
      APP_ENV: staging
      MIGRATIONS_DIR: /migrations
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL}
    entrypoint: [/migrate]
    depends_on: { postgres: { condition: service_healthy } }
    volumes: [../../backend/migrations:/migrations:ro]
    profiles: [ops]
  postgres:
    image: postgres:18.1-alpine
    env_file: ["${STAGING_ENV_FILE:-deploy/staging/env.example}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drlife_staging}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data, ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro]
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
  redis-state:
    image: redis:7.4-alpine
    environment:
      REDIS_STATE_PASSWORD: "${REDIS_STATE_PASSWORD:?set REDIS_STATE_PASSWORD}"
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$${REDIS_STATE_PASSWORD}"']
    volumes: [redis-state:/data]
    healthcheck: { test: [CMD-SHELL, 'redis-cli -a "$${REDIS_STATE_PASSWORD}" ping'] }
  redis-queue:
    image: redis:7.4-alpine
    environment:
      REDIS_QUEUE_PASSWORD: "${REDIS_QUEUE_PASSWORD:?set REDIS_QUEUE_PASSWORD}"
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$${REDIS_QUEUE_PASSWORD}"']
    volumes: [redis-queue:/data]
    healthcheck: { test: [CMD-SHELL, 'redis-cli -a "$${REDIS_QUEUE_PASSWORD}" ping'] }
  redis-cache:
    image: redis:7.4-alpine
    environment:
      REDIS_CACHE_PASSWORD: "${REDIS_CACHE_PASSWORD:?set REDIS_CACHE_PASSWORD}"
    command: [sh, -c, 'exec redis-server --maxmemory-policy allkeys-lru --requirepass "$${REDIS_CACHE_PASSWORD}"']
    volumes: [redis-cache:/data]
    healthcheck: { test: [CMD-SHELL, 'redis-cli -a "$${REDIS_CACHE_PASSWORD}" ping'] }
  buyer:
    image: nginx:1.29.3-alpine
    volumes: ["${STAGING_SITE_ROOT:?set STAGING_SITE_ROOT}/buyer/current:/usr/share/nginx/html:ro"]
  merchant:
    image: nginx:1.29.3-alpine
    volumes: ["${STAGING_SITE_ROOT:?set STAGING_SITE_ROOT}/merchant/current:/usr/share/nginx/html:ro"]
  admin:
    image: nginx:1.29.3-alpine
    volumes: ["${STAGING_SITE_ROOT:?set STAGING_SITE_ROOT}/admin/current:/usr/share/nginx/html:ro"]
  edge:
    image: nginx:1.29.3-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - "${STAGING_ORIGIN_CERT_PATH:?set STAGING_ORIGIN_CERT_PATH}:/etc/nginx/tls/origin.crt:ro"
      - "${STAGING_ORIGIN_KEY_PATH:?set STAGING_ORIGIN_KEY_PATH}:/etc/nginx/tls/origin.key:ro"
    depends_on: [api, buyer, merchant, admin]

volumes:
  postgres-data:
  redis-state:
  redis-queue:
  redis-cache:
