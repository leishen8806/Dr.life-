# To tune the limit, change the rate and burst values on this file together;
# they are deliberately explicit because nginx does not expand compose env vars.
limit_req_zone $binary_remote_addr zone=admin_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name test-api.drlifeplus.com;
    ssl_certificate /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;
    location ^~ /v1/admin/auth/ {
        limit_req zone=admin_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        include /etc/nginx/proxy_params;
    }
    location / { proxy_pass http://api:8080; include /etc/nginx/proxy_params; }
}

