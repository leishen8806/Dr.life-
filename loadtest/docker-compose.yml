# Load-test rig only. Never point this stack at production and never reuse its credentials.
name: drlife-loadtest

x-app-env: &app-env
  APP_ENV: dev
  APP_RELEASE: loadtest
  LOG_LEVEL: info
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9100"
  DATABASE_URL: "postgres://drlife:loadtest-only@postgres:5432/drlife?sslmode=disable"
  REPORT_DATABASE_URL: "postgres://drlife:loadtest-only@postgres-replica:5432/drlife?sslmode=disable"
  REDIS_URL: "redis://redis-state:6379/0"
  CACHE_REDIS_URL: "redis://redis-cache:6379/0"
  QUEUE_REDIS_URL: "redis://redis-queue:6379/0"
  QUEUE_ALLOW_EVICTION: "false"
  DB_MAX_CONNS: "20"
  DB_MIN_CONNS: "2"
  DB_REPORT_MAX_CONNS: "10"
  DB_WORKER_MAX_CONNS: "10"
  RATE_LIMIT_IP_PER_MINUTE: "120"
  RATE_LIMIT_ACCOUNT_PER_MINUTE: "120"
  RATE_LIMIT_LOGIN_PER_MINUTE: "60"
  RATE_LIMIT_WITHDRAW_PER_MINUTE: "60"
  # Test-rig bulkhead: /v1/public/ping is forced into the heavy class so overload
  # behaviour can be exercised without a business heavy endpoint on the baseline.
  BULKHEAD_TOTAL: "64"
  BULKHEAD_CRITICAL_LIMIT: "64"
  BULKHEAD_HEAVY_LIMIT: "4"
  BULKHEAD_WAIT_MS: "100"
  BULKHEAD_ROUTE_CLASSES: "/v1/public/ping=heavy,/readyz=critical"
  BROWNOUT_ESCALATE_AFTER_SECONDS: "600"
  BROWNOUT_RECOVER_AFTER_SECONDS: "60"
  BROWNOUT_P95_THRESHOLD_MS: "5000"
  BROWNOUT_SAMPLE_INTERVAL_MS: "1000"
  SHUTDOWN_TIMEOUT_SECONDS: "5"
  READ_HEADER_TIMEOUT_SECONDS: "2"
  READ_TIMEOUT_SECONDS: "10"
  IDLE_TIMEOUT_SECONDS: "30"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drlife
      POSTGRES_USER: drlife
      POSTGRES_PASSWORD: loadtest-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drlife -d drlife"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  # Stand-in for the report/replica pool. It is a separate database so that
  # stopping it exercises report-pool failure without touching the oltp pool.
  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drlife
      POSTGRES_USER: drlife
      POSTGRES_PASSWORD: loadtest-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drlife -d drlife"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-state:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-queue:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app-a:
    image: drlife-loadtest:base
    build:
      context: ..
      dockerfile: loadtest/docker/app.Dockerfile
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-state:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  app-b:
    image: drlife-loadtest:base
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-state:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    image: drlife-loadtest:base
    entrypoint: ["/worker"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1h"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      prometheus:
        condition: service_started
