<style>
:root{--g:#12a37f;--gd:#0b7a5e;--gl:#e3f6ef;--ink:#13211d;--mu:#6a7a75;--ln:#e5ece9;--bg:#f3f6f5;--card:#fff;--am:#f0a02b;--aml:#fff4de;--rd:#d54a3c;--bl:#3b64c4;--bll:#e8eefb;--sh:0 2px 10px rgba(16,40,32,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:14px/1.55 "Noto Sans Khmer",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Leelawadee UI",sans-serif;color:var(--ink);background:#d9e3df;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column}
.hd{background:linear-gradient(160deg,#0b7a5e 0%,#12a37f 60%,#3cc6a0 100%);color:#fff;padding:14px 16px 52px;border-radius:0 0 26px 26px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:21px;font-weight:800}.logo b{color:#ffd37a}
.logo small{display:block;font-size:10px;font-weight:400;opacity:.8;margin-top:-3px}
.lang,.role{display:flex;background:rgba(255,255,255,.18);border-radius:16px;padding:2px}
.lang button,.role button{border:0;background:none;color:#fff;padding:3px 10px;border-radius:14px;font:inherit;font-size:12px;cursor:pointer;opacity:.85}
.lang button.on,.role button.on{background:#fff;color:var(--gd);font-weight:700;opacity:1}
.role{margin:12px 0 0;background:rgba(0,0,0,.14);border-radius:12px;padding:3px}
.role button{flex:1;padding:7px 0;border-radius:10px;font-size:13px}
.demo{margin:-30px 14px 0;background:var(--aml);color:#85570a;border-radius:10px;padding:5px 10px;font-size:11px;box-shadow:var(--sh);position:relative}
main{flex:1;padding:12px 16px 96px}
nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#fff;border-top:1px solid var(--ln);display:flex}
nav button{flex:1;border:0;background:none;padding:8px 0 9px;font:inherit;font-size:10.5px;color:var(--mu);cursor:pointer;position:relative}
nav button .i{display:block;font-size:20px;line-height:1.25;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--g);font-weight:700}nav button.on .i{filter:none;opacity:1}
.bdg{position:absolute;top:3px;left:55%;background:var(--rd);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;line-height:15px}
h2{font-size:15px;margin:16px 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}h2:first-child{margin-top:4px}
h2 a{font-size:12px;font-weight:400;color:var(--gd);cursor:pointer}
.card{background:var(--card);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:12px}.b{font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:3px 12px;box-shadow:var(--sh)}
.search input{border:0;outline:0;padding:9px 0;flex:1;font:inherit;background:none}
.fake{color:var(--mu);padding:10px 0;cursor:pointer;flex:1}
.chips{display:flex;gap:7px;overflow-x:auto;margin:12px -16px 8px;padding:0 16px;scrollbar-width:none}
.chip{border:1px solid var(--ln);background:#fff;border-radius:16px;padding:5px 13px;font:inherit;font-size:12.5px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.sw{display:flex;background:#e6eeeb;border-radius:12px;padding:3px;margin-bottom:10px}
.sw button{flex:1;border:0;background:none;padding:7px 0;border-radius:10px;font:inherit;font-size:13px;color:var(--mu);cursor:pointer}
.sw button.on{background:#fff;color:var(--gd);font-weight:700;box-shadow:var(--sh)}
.ico{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;text-align:center;font-size:12px}
.ico div{cursor:pointer}.ico .t{width:48px;height:48px;border-radius:15px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:24px}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hs .pc{flex:0 0 138px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--sh);cursor:pointer}
.pc .im{height:96px;display:flex;align-items:center;justify-content:center;font-size:40px}
.pc .bd{padding:8px 10px 10px}.pc .nm{font-size:13px;font-weight:600;line-height:1.35;height:35px;overflow:hidden}
.pr{color:var(--rd);font-weight:800;font-size:15px}.pr small{font-size:11px;font-weight:400;color:var(--mu)}
.cta{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#fff4de,#ffe7b8);border-radius:14px;padding:12px;margin:12px 0;cursor:pointer;box-shadow:var(--sh)}
.cta .ic{font-size:26px}.cta .tt{font-weight:700;color:#7a4c00}.cta .ss{font-size:12px;color:#94651a}
.cta.fin{background:linear-gradient(120deg,#e8eefb,#d3dffa)}.cta.fin .tt{color:#24408c}.cta.fin .ss{color:#4b64a8}
.av{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
.li{display:flex;gap:11px;align-items:center;cursor:pointer}.li .bd{flex:1;min-width:0}.li .ch{color:#b6c2be;font-size:20px}
.tag{display:inline-block;font-size:10.5px;padding:0 7px;border-radius:8px;margin-left:5px;vertical-align:1px;line-height:17px}
.t-self{background:#ffe9d6;color:#b25a00}.t-ok{background:var(--gl);color:var(--gd)}.t-no{background:#eceeed;color:#7b8581}.t-cn{background:#fde8e6;color:#b8372b;margin:0 4px 0 0}.t-lc{background:var(--bll);color:var(--bl);margin:0 4px 0 0}
.st{font-size:11.5px;padding:2px 10px;border-radius:10px;background:var(--gl);color:var(--gd);white-space:nowrap;font-weight:600}
.st.w{background:var(--aml);color:#a2680b}.st.d{background:var(--bll);color:var(--bl)}
.btn{border:0;background:var(--g);color:#fff;padding:11px 14px;border-radius:12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
.btn.s{width:auto;padding:6px 14px;font-size:13px;margin:0}.btn.o{background:#fff;color:var(--gd);border:1px solid var(--g)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:6px}
input:focus,select:focus,textarea:focus{outline:2px solid #bfe9db;border-color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.note{background:var(--gl);border-radius:10px;padding:9px 11px;font-size:12px;color:#17624c;margin:10px 0}.note.w{background:var(--aml);color:#85570a}.note.f{background:var(--bll);color:#24408c}
.back{cursor:pointer;color:var(--gd);margin-bottom:8px;display:inline-block;font-weight:600}
.cover{height:84px;border-radius:14px 14px 0 0;margin:-13px -13px 0}
.big{width:62px;height:62px;border-radius:16px;font-size:26px;margin-top:-31px;margin-left:2px;border:3px solid #fff}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--ln)}.kv:last-child{border:0}
.quote{border:1px solid var(--ln);border-radius:12px;padding:11px;margin-top:8px;background:#fff}.quote.sel{border-color:var(--g);background:#f1fbf7}
.pos{color:var(--gd);font-weight:700}.neg{color:var(--rd);font-weight:700}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.steps{display:flex;margin:10px 0 2px}
.steps div{flex:1;text-align:center;font-size:11px;color:var(--mu);position:relative}
.steps div:before{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#e1e8e5;margin:0 auto 4px;position:relative;z-index:1}
.steps div:after{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:#e1e8e5}
.steps div:first-child:after{display:none}
.steps div.done{color:var(--gd);font-weight:600}.steps div.done:before,.steps div.done:after{background:var(--g)}
.tier{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.tier div{background:var(--bg);border-radius:10px;padding:7px 2px}.tier .pr{font-size:14px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--ln);background:#fff;font-size:16px;cursor:pointer}.qty input{width:56px;text-align:center;padding:5px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .card{margin:0;text-align:center}.stat .n{font-size:24px;font-weight:800;color:var(--gd)}
.mall{display:flex;margin:10px -16px 0;background:#fff;border-top:1px solid var(--ln);min-height:calc(100vh - 330px)}
.cats{width:88px;flex:none;background:var(--bg);align-self:stretch}
.cats div{padding:15px 6px;text-align:center;font-size:13px;color:#44524e;cursor:pointer;position:relative;line-height:1.3}
.cats div .e{display:block;font-size:20px;margin-bottom:2px}
.cats div.on{background:#fff;color:var(--gd);font-weight:700}
.cats div.on:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--g)}
.plist{flex:1;min-width:0;padding:8px 12px 14px}
.pl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pl-f{display:flex;gap:6px;margin-bottom:8px}
.pl-f .chip{padding:3px 10px;font-size:12px}
.prow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.prow:last-child{border:0}
.prow .im{width:84px;height:84px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:36px}
.prow .bd{flex:1;min-width:0}.prow .nm{font-size:13.5px;font-weight:600;line-height:1.35;margin-bottom:2px}
.prow .add{border:0;background:var(--g);color:#fff;width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;flex:none;align-self:flex-end}
.vt{margin:10px 0 0 6px;border-left:2px solid var(--ln);padding-left:16px}
.vt .n{position:relative;padding-bottom:11px;color:var(--mu);font-size:13px}
.vt .n:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #cdd7d3}
.vt .n.done{color:var(--ink)}.vt .n.done:before{background:var(--g);border-color:var(--g)}
.vt .n.cur{font-weight:700;color:var(--gd)}.vt .n.cur:before{box-shadow:0 0 0 4px #bfe9db}
.vt .n i{display:block;font-style:normal;font-size:11px;color:var(--mu);font-weight:400}
.bar{height:6px;background:#e1e8e5;border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--g)}
.vt .h{font-weight:700;color:var(--gd);font-size:12px;margin:4px 0 8px -16px;padding-left:16px}.vt .h:before{display:none}
.pc{position:relative}
.adtag{position:absolute;top:6px;left:6px;z-index:2;background:rgba(0,0,0,.45);color:#fff;font-size:10px;padding:0 6px;border-radius:6px;line-height:16px}
.wf{column-count:2;column-gap:10px}.wf .pc{break-inside:avoid;margin-bottom:10px;display:block}
.bn{position:relative;display:flex;align-items:center;gap:14px;height:96px;border-radius:14px;padding:0 16px;margin-top:12px;cursor:pointer;box-shadow:var(--sh);overflow:hidden}
.bn-em{font-size:46px}.dots{position:absolute;bottom:6px;right:12px;display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:3px;background:#0003}.dots i.on{background:var(--g)}
#splash{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#e3f6ef,#fff)}
.sp-skip{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.45);color:#fff;border-radius:14px;padding:3px 12px;font-size:12px;cursor:pointer}.sp-c{text-align:center;cursor:pointer}
.sp-b{position:absolute;bottom:26px;font-size:20px;font-weight:800;color:var(--gd)}.sp-b b{color:var(--am)}
.dmap{margin:-12px -16px 0;position:relative;background:#e3ede8}.dmap svg{display:block;width:100%}
.dchip{position:absolute;top:10px;left:10px;background:#fff;border-radius:14px;padding:5px 12px;font-size:12px;box-shadow:var(--sh)}.dchip i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf6c;margin-right:6px}
.dzoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}.dzoom button{width:34px;height:34px;border-radius:10px;border:0;background:#fff;box-shadow:var(--sh);font-size:18px;cursor:pointer}
.dsheet{background:#fff;border-radius:20px 20px 0 0;margin:-16px -16px 0;padding:12px 16px 4px;position:relative;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.dsheet:before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:#d5ded9;margin:0 auto 10px}
.num{display:inline-flex;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;align-items:center;justify-content:center;margin-right:8px;flex:none}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;text-align:center}.sc>div{cursor:pointer;padding:4px 0}.sc .n{font-size:18px;font-weight:800;color:var(--gd);word-break:break-all}.sc .l{font-size:11px;color:var(--mu)}
.pg2{display:grid;gap:14px;grid-template-columns:1fr}
.tw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden}
.tbl th{text-align:left;color:var(--mu);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;background:#fafcfb}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--ln);vertical-align:top}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:#f6fbf9}.tbl tr.sel{background:var(--gl)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.tbl .nw{white-space:nowrap}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.fl select,.fl input{width:auto;min-width:160px}
body.pc{background:#e9efec}
body.pc #app{max-width:1220px;display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto auto 1fr;min-height:100vh}
body.pc .hd{grid-column:1/-1;border-radius:0;padding:14px 28px 46px}
body.pc .role{max-width:560px}
body.pc .demo{grid-column:1/-1;margin:-26px 28px 0}
body.pc nav{position:sticky;top:0;grid-column:1;grid-row:3;align-self:start;width:auto;max-width:none;flex-direction:column;border-top:0;border-right:1px solid var(--ln);background:#fff;height:100vh;padding-top:14px}
body.pc nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:13px 20px;font-size:14px;flex:none}
body.pc nav button .i{display:inline;font-size:18px;filter:none;opacity:1}
body.pc nav button.on{background:var(--gl);box-shadow:inset 3px 0 0 var(--g)}
body.pc main{grid-column:2;grid-row:3;padding:20px 28px 40px}
body.pc .stat{grid-template-columns:repeat(3,1fr)}
body.pc .pg2{display:block}
.pg3{display:grid;gap:14px;grid-template-columns:1fr}body.pc .pg3{grid-template-columns:1fr 1fr;align-items:start}
.tbl.led{min-width:900px}.tbl.led td:nth-child(4),.tbl.led td:nth-child(5){min-width:190px}.tbl.led td:nth-child(7){min-width:130px}
body.pc .drawer{position:fixed;right:max(16px,calc((100vw - 1220px)/2 + 16px));top:96px;width:390px;max-height:calc(100vh - 120px);overflow:auto;z-index:30;box-shadow:0 10px 34px rgba(0,0,0,.22);border-radius:14px;background:#f6f9f8;padding:10px}
.ng{display:none}
body.pc nav .ng{display:block;padding:14px 20px 4px;font-size:11px;color:var(--mu);letter-spacing:.5px}
body.pc nav{overflow-y:auto}
.hb{display:flex;align-items:center;gap:8px;margin:7px 0}.hb .l{width:130px;font-size:12px;color:var(--mu);flex:none}.hb .tr{flex:1;background:#e1e8e5;height:10px;border-radius:5px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--g)}.hb .v{width:70px;text-align:right;font-size:12px;font-weight:700;flex:none}
.sev{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:700}.sev.ok{background:var(--gl);color:var(--gd)}.sev.watch{background:var(--aml);color:#a2680b}.sev.alert{background:#fde4e1;color:var(--rd)}
.bellb{position:relative;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:3px 9px;font-size:15px;cursor:pointer}.bellb i{position:absolute;top:-4px;right:-4px;background:var(--rd);color:#fff;font-style:normal;font-size:10px;border-radius:8px;padding:0 5px;line-height:15px}
.msg{display:flex;gap:10px;cursor:pointer}.msg .dot{width:8px;height:8px;border-radius:50%;background:var(--rd);margin-top:6px;flex:none}.msg .dot.r{background:transparent}
.chb{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:7px;margin:2px 4px 0 0;line-height:17px;background:var(--gl);color:var(--gd)}.chb.x{background:#eceeed;color:#8a9a95;text-decoration:line-through}
.foot{text-align:center;color:var(--mu);font-size:12px;margin:16px 0}
.aibox{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px;max-height:52vh;overflow-y:auto}
.aim{display:flex;margin:6px 0}.aim .bb{max-width:82%;background:var(--gl);border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:13.5px;line-height:1.5}
.aim.me{justify-content:flex-end}.aim.me .bb{background:var(--g);color:#fff;border-radius:14px 14px 4px 14px}
.aips{display:flex;gap:8px;overflow-x:auto;margin:4px 0 8px}.aip{flex:0 0 120px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:6px;cursor:pointer}.aip .im{height:64px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:30px}.aip .nm{font-size:12px;font-weight:600;margin-top:4px;height:32px;overflow:hidden}.aip .pr{color:var(--rd);font-weight:700;font-size:13px}
.aisys{text-align:center;font-size:12px;color:#7a4c00;background:var(--aml);border-radius:10px;padding:8px;margin:8px 0}
.aiin{display:flex;gap:8px;margin-top:8px}.aiin input{flex:1}
.aitags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.aitags .chip b{cursor:pointer;color:var(--rd);margin-left:2px}
.chip.on2{background:var(--gl);border-color:var(--g);color:var(--gd)}
.shd{display:flex;gap:8px;align-items:center;margin-bottom:10px}.shd .search{flex:1}.shd .bk{font-size:24px;cursor:pointer;padding:0 4px;color:var(--mu)}
.sug div{padding:10px 2px;border-bottom:1px solid var(--ln);cursor:pointer;font-size:14px}.sug div:last-child{border:0}.sug b{color:var(--g)}
.hot{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}.hot div{padding:6px 0;cursor:pointer;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hot i{font-style:normal;display:inline-block;width:20px;font-weight:700;color:var(--mu)}.hot i.t3{color:var(--rd)}
.sbar{display:flex;background:#fff;border-radius:12px;box-shadow:var(--sh);margin-bottom:10px}.sbar button{flex:1;border:0;background:none;padding:9px 0;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}.sbar button.on{color:var(--rd);font-weight:700}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ssold{font-size:11px;color:var(--mu)}
.bfe{display:flex;gap:6px;align-items:center}.bfe input,.bfe select{width:130px;padding:5px 8px}
.bfa{margin-left:8px;white-space:nowrap}.bfa b{cursor:pointer;color:var(--mu);margin-left:6px;font-weight:400}.bfa b:hover{color:var(--g)}
#langov{position:fixed;inset:0;z-index:9999;background:rgba(19,33,29,.55);display:flex;align-items:center;justify-content:center;padding:20px}.lgb{background:#fff;border-radius:20px;padding:24px 22px;max-width:340px;width:100%;text-align:center}
.mdl{position:fixed;inset:0;z-index:300;background:rgba(19,33,29,.5);display:flex;align-items:flex-end;justify-content:center}.mdb{background:#fff;width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:18px 18px 22px;max-height:90vh;overflow-y:auto}.mdb .mx{cursor:pointer;font-size:18px;color:var(--mu);padding:0 4px}body.pc .mdl{align-items:center}body.pc .mdb{border-radius:16px;max-width:460px}
.msadd{display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--gl);border-radius:22px;padding:4px 5px 4px 16px;color:var(--gd);user-select:none}.msadd .pl{width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}.msadd:active{opacity:.7}
.chipg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}.chipg .chip{padding:7px 4px;text-align:center;overflow:hidden;text-overflow:ellipsis}.chips.wrap{flex-wrap:wrap;overflow:visible;margin:10px 0}
#brand{position:fixed;inset:0;z-index:10000;background:#121214;display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .45s}#brand.out{opacity:0}
.ldr{position:relative;display:inline-flex;align-items:center;justify-content:center;width:var(--s,56px);height:var(--s,56px);flex:none;vertical-align:middle}
.ldr img{width:78%;height:78%;border-radius:50%;object-fit:cover;position:relative;z-index:1;animation:ldPulse 1.6s ease-in-out infinite}
.ldr::before{content:'';position:absolute;inset:0;border-radius:50%;border:max(2px,calc(var(--s,56px)*.035)) solid rgba(182,154,100,.22);border-top-color:#B69A64;animation:ldSpin 1s linear infinite}
.ldr::after{content:'';position:absolute;inset:11%;border-radius:50%;z-index:2;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);background-size:250% 100%;mix-blend-mode:soft-light;animation:ldShine 1.6s ease-in-out infinite}
@keyframes ldSpin{to{transform:rotate(360deg)}}@keyframes ldPulse{50%{transform:scale(.9)}}@keyframes ldShine{from{background-position:130% 0}to{background-position:-130% 0}}
#brand .tg{display:flex;gap:.34em;margin-top:22px;font:600 11px/1 -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.3em;color:#B69A64}
#brand .tg i{font-style:normal;opacity:0;transform:translateY(6px);animation:bLet .5s forwards}@keyframes bLet{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ldr *,.ldr::before,.ldr::after,#brand .tg i{animation-duration:.01s!important}}
.logo img.lg{height:42px;width:auto;display:block;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}.logo small{margin-top:4px}
.logo img.lg{height:44px;width:auto;border-radius:0;box-shadow:none;margin-left:-2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.logo small{font-size:8.5px;font-weight:600;letter-spacing:.2em;opacity:.9;margin-top:1px;white-space:nowrap}
.ldrow{display:flex;align-items:center;gap:10px;justify-content:center;padding:18px 0;color:var(--mu);font-size:12.5px}
.aim .bb.ldb{display:flex;align-items:center;gap:8px;color:var(--mu)}
</style>

function nowS(){var d=new Date(),z=function(n){return (n<10?'0':'')+n};return z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())}
function along(pts,f){
  var Ls=[],tot=0,i;for(i=0;i<pts.length-1;i++){var d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);Ls.push(d);tot+=d}
  var tg=Math.min(1,Math.max(0,f))*tot,acc=0;
  for(i=0;i<Ls.length;i++){if(tg<=acc+Ls[i]||i===Ls.length-1){var r=Ls[i]?Math.min(1,(tg-acc)/Ls[i]):0;return{x:pts[i][0]+(pts[i+1][0]-pts[i][0])*r,y:pts[i][1]+(pts[i+1][1]-pts[i][1])*r,i:i}}acc+=Ls[i]}
}
function poly(pts){return pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')}
function vtl(items){return '<div class="vt">'+items.map(function(x){if(x.head)return '<div class="h">'+x.label+'</div>';return '<div class="n '+(x.done?'done':'')+(x.cur?' cur':'')+'">'+x.label+(x.sub?'<i>'+x.sub+'</i>':'')+'</div>'}).join('')+'</div>'}

var PHASES=[['ph0',0,0],['ph1',1,4],['ph2',5,9],['ph3',10,10],['ph4',11,13],['ph5',14,14],['ph6',15,15]];
var DOCS={1:['d_dn'],3:['d_pl','d_mark'],4:['d_bk'],5:['d_inv','d_pl','d_ct','d_auth'],6:['d_exd'],8:['d_rel'],9:['d_bl'],10:['d_bl'],12:['d_imd','d_co','d_tax'],13:['d_rel'],14:['d_cmr'],15:['d_grn']};
function SH(id){return S.ships.filter(function(s){return s.id===id})[0]}
function shipPos(s){
  var st=s.step,sub=s.sub||0,m,a,d;
  if(st===10){m=along([AN[2],AN[3],AN[4]],sub);a=m.i>=1?3:2;d=AN.slice(0,a+1)}
  else if(st===14){m=along([AN[5],AN[6],AN[7]],sub);a=m.i>=1?6:5;d=AN.slice(0,a+1)}
  else{a=ANI[st];m={x:AN[a][0],y:AN[a][1]};d=AN.slice(0,a)}
  return{m:m,a:a,d:d.concat([[m.x,m.y]])};
}
function shipMap(s){
  var o=shipPos(s),st=s.step,icon=st===10?'🚢':st===14?'🚚':st===15?'✅':[5,6,7,8,9,12,13].indexOf(st)>=0?'🛃':'📦';

  var dots=AN.map(function(a,i){return '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="#fff" stroke="'+(i<=o.a?'#12a37f':'#97a9b8')+'" stroke-width="2"/>'}).join('');

   '<circle cx="'+o.m.x+'" cy="'+o.m.y+'" r="13" fill="#fff" stroke="#12a37f" stroke-width="2"/><text x="'+o.m.x+'" y="'+(o.m.y+5)+'" text-anchor="middle" font-size="15">'+icon+'</text></svg>';

// ================= driver app: big map + task tabs =================
var WH=[300,300];
function siteOf(p){var a=(p.id*97)%260-130,b=(p.id*53)%220-110;if(Math.abs(a)<45)a+=a<0?-65:65;if(Math.abs(b)<45)b+=b<0?-55:55;return[WH[0]+a,WH[1]+b]}
function drvXY(did){
  var act=S.projects.filter(function(p){return p.drv===did&&p.ms===2&&!p.closed})[0];
  var wait=S.projects.filter(function(p){return p.drv===did&&p.ms===1&&p.acc})[0];
  if(act){var q=siteOf(act),f=Math.min(1,act.pos||0);return[WH[0]+(q[0]-WH[0])*f,WH[1]+(q[1]-WH[1])*f]}
  if(wait)return[WH[0],WH[1]];
  return[WH[0]+26,WH[1]+20];
}
function dtasks(tab){
  var l=S.projects.filter(function(p){return p.drv===S.meDrv});
  if(tab==='new')return l.filter(function(p){return !p.acc&&p.ms<3});
  if(tab==='doing')return l.filter(function(p){return p.acc&&p.ms<3});
  return l.filter(function(p){return p.ms>=3});
}
function km(a,b){return (Math.hypot(a[0]-b[0],a[1]-b[1])*0.04).toFixed(1)}
function driverMap(list){
  var d=DR(S.meDrv),c=drvXY(d.id),z=ui.dz||1,w=360/z,h=380/z,vx=c[0]-w/2,vy=c[1]-h/2,i,g='';
  for(i=-1;i<9;i++){g+='<line x1="'+(i*90)+'" y1="-100" x2="'+(i*90)+'" y2="800" stroke="#fff" stroke-width="9"/><line x1="-100" y1="'+(i*90+20)+'" x2="800" y2="'+(i*90+20)+'" stroke="#fff" stroke-width="9"/>'}
  g+='<line x1="-100" y1="100" x2="700" y2="700" stroke="#f6f9f7" stroke-width="12"/><line x1="100" y1="-100" x2="700" y2="500" stroke="#f6f9f7" stroke-width="8"/>';
  var cols={0:'#e8890c',1:'#12a37f',2:'#8a9a95'},pins='',lines='';

// ================= pilot warehouse: zones, automated shelving, bin-level inventory =================
var ZONES={A:{auto:1,cap:1.8,shelves:6,levels:5,bins:74},B:{cap:1.8,shelves:10,levels:2,bins:97},C:{cap:4,shelves:8,levels:2,bins:39}},BIN_LIST={};
Object.keys(ZONES).forEach(function(z){var Z=ZONES[z],o=[];for(var a=1;a<=Z.shelves;a++)for(var l=1;l<=Z.levels;l++)for(var b=1;b<=Z.bins;b++)o.push(z+(a<10?'0':'')+a+'-'+l+'-'+b);BIN_LIST[z]=o});
function shelfOf(bin){return bin.split('-')[0]}
function binUse(){
  var m={};Object.keys(S.stock).forEach(function(pid){var p=PR(+pid),v=p?volOf(p):0;(S.stock[pid].locs||[]).forEach(function(l){if(l.bin!=='OVF')m[l.bin]=(m[l.bin]||0)+l.qty*v})});return m;
}
function zoneFor(p){var v=volOf(p),z=S.zmap[p.cat]||'B';if(v>ZONES[z].cap)z=['B','C'].filter(function(k){return v<=ZONES[k].cap})[0]||'O';return z}
function setLoc(st){st.loc=st.locs.length?st.locs[0].bin+(st.locs.length>1?' +'+(st.locs.length-1):''):'-'}
function putAway(pid,qty){
  var p=PR(pid),v=volOf(p),st=S.stock[pid]||(S.stock[pid]={qty:0,loc:'-',locs:[]});if(!st.locs)st.locs=[];
  var z=zoneFor(p),rem=qty,use=binUse();
  if(z!=='O'){var Z=ZONES[z];BIN_LIST[z].forEach(function(b){
    if(rem<=0||S.dev[shelfOf(b)]==='off')return;
    var n=Math.floor((Z.cap-(use[b]||0)+1e-9)/v);if(n<=0)return;var take=Math.min(n,rem),ex=st.locs.filter(function(l){return l.bin===b})[0];
    if(ex)ex.qty+=take;else st.locs.push({bin:b,qty:take});use[b]=(use[b]||0)+take*v;rem-=take})}
  if(rem>0){var o=st.locs.filter(function(l){return l.bin==='OVF'})[0];if(o)o.qty+=rem;else st.locs.push({bin:'OVF',qty:rem})}
  st.qty+=qty;setLoc(st);
}
function removeStock(pid,qty,lifo){
  var st=stockOf(pid),rem=qty,arr=lifo?st.locs.slice().reverse():st.locs.slice();
  arr.forEach(function(l){if(rem<=0)return;var t0=Math.min(l.qty,rem);l.qty-=t0;rem-=t0});
  st.locs=st.locs.filter(function(l){return l.qty>0});st.qty=Math.max(0,st.qty-qty);setLoc(st);
}
function zoneTag(st){return st.locs&&st.locs[0]?' · '+t('zn_'+(st.locs[0].bin==='OVF'?'O':st.locs[0].bin.charAt(0))):''}
function binsText(st){var l=(st.locs||[]);return l.length?l.slice(0,3).map(function(x){return x.bin+'×'+x.qty}).join(', ')+(l.length>3?' …':''):'-'}
function shelvesOf(p){
  var seen={},o=[];(p.items||[]).forEach(function(i){(stockOf(i.pid).locs||[]).forEach(function(l){if(l.bin.charAt(0)==='A'){var sh=shelfOf(l.bin);if(!seen[sh]){seen[sh]=1;o.push(sh)}}})});return o;
}

function sysBal(a){
  if(a==='o')return bal('o');
  if(/^m\d+$/.test(a)||/^d\d+$/.test(a))return bal(a.charAt(0)==='m'?a.slice(1):a);
  if(a==='FRZ')return frozenOf('o');
  if(a==='WD')return r2(S.wd.filter(function(w){return w.st==='proc'}).reduce(function(x,w){return x+w.amt},0));
  if(a==='DH')return r2(S.projects.filter(function(p){return p.fee&&!p.feeRel}).reduce(function(x,p){return x+p.fee.total},0));
  if(a==='ADB')return r2(S.camps.filter(function(c){return !c.free}).reduce(function(x,c){return x+(c.budget-c.spent)},0));
  return null;
}
function paccV(){
  var net=ledNet(),keys=Object.keys(net);

  var order=function(a){return a==='o'?0:/^m/.test(a)?1:/^d/.test(a)?2:a==='P'?3:a==='EXT'?9:4};
  keys.sort(function(a,b){return order(a)-order(b)||a.localeCompare(b)});
  var tot=r2(keys.reduce(function(a,k){return a+(net[k]||0)},0)),bad=0;
  var rows=keys.map(function(k){var l=net[k]||0,sv=sysBal(k),diff=sv==null?null:r2(l-sv);if(diff!=null&&Math.abs(diff)>0.005)bad++;
    return '<tr style="cursor:default"><td>'+esc(acctName(k))+'</td><td class="r">'+usd(l)+'</td><td class="r">'+(sv==null?t('rc_na'):usd(sv))+'</td><td class="r b '+(diff==null?'':Math.abs(diff)>0.005?'neg':'pos')+'">'+(diff==null?t('rc_na'):Math.abs(diff)>0.005?usd(diff):t('rc_ok'))+'</td></tr>'}).join('');

  return '<h2>'+t('rc_t')+'</h2><div class="note '+(Math.abs(tot)<0.005&&!bad?'':'w')+'">'+(Math.abs(tot)<0.005?t('rc_balanced'):t('rc_unbal')+' '+usd(tot))+'</div>'+

   '<h2>'+t('rc_orders')+'</h2><div class="tw"><table class="tbl"><thead><tr><th>'+t('order_t')+'</th><th>'+t('r_biz')+'</th><th class="r">'+t('fee_total')+'</th><th class="r">'+t('rl_driver')+'</th><th class="r">'+t('rl_platform')+'</th><th class="r">'+t('rl_carrier')+'</th><th>'+t('rc_status')+'</th></tr></thead><tbody>'+(orows||'<tr><td colspan="7" class="empty">'+t('led_e')+'</td></tr>')+'</tbody></table></div>';
}

function revParts(e){
  var o={storage:0,ads:0,dm:0,fee:0,mem:0};
  if(e.type==='storage_fee')o.storage=e.amt;
  else if(e.type==='ad_spend')o.ads=e.amt;
  else if(e.type==='delivery_release')e.split.forEach(function(x){if(x.to==='P')o.dm+=x.amt});
  else if(e.type==='settle')e.split.forEach(function(x){if(x.to==='P')o.fee+=x.amt});
  else if(e.type==='member_fee')o.mem=e.amt;
  return o;
}

function auditChecks2(){
  function r(id,sev,detail){return{id:id,sev:sev,detail:detail}}
  var bad=[],ids={};
  S.led.forEach(function(e){if(ids[e.id])bad.push('dup '+e.id);ids[e.id]=1;if(!e.id||!e.ts||!e.type||!e.from||!(e.amt>0)||!e.split||!e.by)bad.push('field '+e.id);var sm=r2(e.split.reduce(function(a,x){return a+x.amt},0));if(Math.abs(sm-e.amt)>0.005)bad.push('split '+e.id)});
  var ledS=0,ledD=0,ledA=0,ledM=0;S.led.forEach(function(e){if(e.memo)return;var p=revParts(e);ledS+=p.storage;ledD+=p.dm;ledA+=p.ads;ledM+=p.mem});
  var adSys=r2(S.camps.filter(function(c){return !c.free}).reduce(function(a,c){return a+c.spent},0));
  var rc=[];if(Math.abs(r2(ledS-S.revS))>0.005)rc.push(t('fi_storage'));if(Math.abs(r2(ledD-S.revD))>0.005)rc.push(t('fi_dmargin'));if(Math.abs(r2(ledA-adSys))>0.005)rc.push(t('fi_ads'));if(Math.abs(r2(ledM-(S.revM||0)))>0.005)rc.push(t('fi_mem'));
  var si=[],ovf=0;S.products.forEach(function(p){var st=stockOf(p.id),sm=st.locs.reduce(function(a,l){return a+l.qty},0);if(sm!==st.qty||st.qty<0)si.push(tx(p.name));st.locs.forEach(function(l){if(l.bin==='OVF')ovf+=l.qty})});
  var use=binUse();Object.keys(use).forEach(function(b){if(use[b]>ZONES[b.charAt(0)].cap+1e-6)si.push(b)});
  var ig=S.integ.filter(function(x){return x.status==='error'}),igw=S.integ.filter(function(x){return x.status==='on'&&x.env==='sandbox'});
  var stale=S.wd.filter(function(w){return w.st==='proc'&&w.ts&&(Date.now()-new Date(w.ts.replace(' ','T')).getTime())>86400000});
  var byAcct={};S.wd.forEach(function(w){var k=String(w.to||'').trim().toLowerCase();if(!k||k==='-')return;(byAcct[k]=byAcct[k]||{})[w.acct]=1});var dupe=Object.keys(byAcct).filter(function(k){return Object.keys(byAcct[k]).length>1});
  var arr=S.listings.filter(function(l){return dueOf(l.id).st>S.audCfg.arrears});
  return[
    r('ledint',bad.length?'alert':'ok',bad.length?bad.slice(0,4).join(', '):t('ck_d_ok')),
    r('revcons',rc.length?'alert':'ok',rc.length?rc.join(', '):t('ck_d_ok')),
    r('stockint',si.length?'alert':ovf?'watch':'ok',si.length?si.slice(0,4).join(', '):ovf?t('zn_O')+' '+ovf:t('ck_d_ok')),
    r('integ',ig.length?'alert':igw.length?'watch':'ok',ig.length?ig.map(function(x){return t('i_'+x.id)}).join(', '):igw.length?igw.map(function(x){return t('i_'+x.id)}).join(', ')+' ('+t('in_sandbox')+')':t('ck_d_ok')),
    r('wdstale',stale.length?'watch':'ok',stale.length?stale.length+t('ck_d_n'):t('ck_d_ok')),
    r('wddupe',dupe.length?'watch':'ok',dupe.length?dupe.slice(0,3).join(', '):t('ck_d_ok')),
    r('arrears',arr.length?'watch':'ok',arr.length?arr.map(function(l){return tx(l.name)}).join(', '):t('ck_d_ok'))
  ];
}

  out('inapp',true);

function kwHit(s,list){for(var i=0;i<list.length;i++)if(s.indexOf(list[i])>=0)return true;return false}
function parseNeeds(text,role){
  var s=' '+String(text).toLowerCase(),out=[];
  Object.keys(KW).forEach(function(g){if(g==='need'&&role!=='biz')return;Object.keys(KW[g]).forEach(function(v){if(kwHit(s,KW[g][v]))out.push(g+':'+v)})});

var PSTD=[['name3',10],['cat',10],['spec',15],['tiers',15],['vol',10],['lead',10],['origin',5],['img',15],['stock',10]];
function prodStd(p){
  var ok={name3:!!(p.name&&typeof p.name==='object'&&p.name.zh&&p.name.en&&p.name.km),cat:!!p.cat&&(BCATS.indexOf(p.cat)>=0||!!(S.cx&&S.cx[p.cat])),spec:!!(p.spec&&String(tx(p.spec)).trim()),tiers:!!(p.tiers&&p.tiers.length>=2),vol:!!(p.vol||VOL[p.id]),lead:p.lead>0,origin:!!p.origin,img:!!p.img,stock:stockOf(p.id).qty>0};
  var sc=0,miss=[];PSTD.forEach(function(r){if(ok[r[0]])sc+=r[1];else miss.push(r[0])});
  return{score:sc,grade:sc>=85?'A':sc>=70?'B':'C',miss:miss};
}
function merStd(l){
  if(!l)return{score:0,grade:'D',parts:{}};
  var k=l.id,mine=S.products.filter(function(p){return p.sup===k}),ords=S.projects.filter(function(p){return p.kind==='order'&&p.sup===k}),pt={};
  pt.ver=(l.kind==='ok'||l.kind==='self')?30:0;
  pt.info=Math.round([l.phone,l.addr,l.contact,tx(l.desc)].filter(function(x){return x&&String(x).trim()}).length/4*15);
  pt.pq=mine.length?Math.round(mine.reduce(function(a,p){return a+prodStd(p).score},0)/mine.length/100*20):0;
  pt.ful=ords.length?Math.round(ords.filter(function(p){return p.closed}).length/ords.length*20):10;
  pt.wh=mine.some(function(p){return stockOf(p.id).qty>0})?15:0;
  pt.prob=-5*ords.filter(function(p){return p.problem}).length;
  var sc=Math.max(0,pt.ver+pt.info+pt.pq+pt.ful+pt.wh+pt.prob);
  return{score:sc,grade:sc>=85?'A':sc>=70?'B':sc>=50?'C':'D',parts:pt};
}

var SYN=[['瓷砖','地砖','抛光砖','砖','tile','tiles','ក្បឿង'],['地板','木地板','spc','floor','flooring','កម្រាល'],['马桶','坐便器','座便器','toilet','បង្គន់'],['卫浴','浴室','卫生间','bathroom','sanitary'],['橱柜','厨柜','cabinet','kitchen','ទូ'],['门','木门','door','ទ្វារ'],['沙发','家具','sofa','couch','furniture','សាឡុង'],['水泥','cement','ស៊ីម៉ងត៍'],['漆','涂料','乳胶漆','paint','ថ្នាំ']];
var HOT0=[['c:c4',320],['c:c2',260],['p:7',240],['c:c3',210],['p:8',180],['c:c8',150],['c:c5',120],['p:3',90]];
function allL(o){return o&&typeof o==='object'?Object.keys(o).map(function(k){return o[k]}).join(' '):String(o==null?'':o)}
function catAll(c){var v=T[c];return v?v.join(' '):String(t(c))}
function wide(x){return x.length>=2||/[^\x00-\x7f]/.test(x)}
function expandQ(w){var out=[w];SYN.forEach(function(g){if(g.some(function(x){x=x.toLowerCase();return x===w||(wide(w)&&x.indexOf(w)>=0)||(wide(x)&&w.indexOf(x)>=0)}))g.forEach(function(x){out.push(x.toLowerCase())})});return out}
function prodHay(p){var s=L(p.sup);return (allL(p.name)+' '+allL(p.spec)+' '+catAll(p.cat)+' '+(s?allL(s.name):'')).toLowerCase()}
function relOf(p,q){
  var ws=String(q).toLowerCase().split(/\s+/).filter(Boolean);if(!ws.length)return 0;var nm=allL(p.name).toLowerCase(),hay=prodHay(p),sc=0;
  for(var i=0;i<ws.length;i++){var w=ws[i];if(nm.indexOf(w)>=0)sc+=3;else if(hay.indexOf(w)>=0)sc+=2;else if(expandQ(w).some(function(x){return hay.indexOf(x)>=0}))sc+=1;else return 0}
  return sc/ws.length;
}
function searchRun(q,f){
  f=f||{cat:'all',org:'all',pmin:'',pmax:'',stock:false};
  return S.products.filter(prodOk).map(function(p){return{p:p,r:relOf(p,q)}}).filter(function(x){var p=x.p,pr=p.tiers[0][1];
    return x.r>0&&(f.cat==='all'||p.cat===f.cat)&&(f.org==='all'||p.origin===f.org)&&(f.pmin===''||pr>=+f.pmin)&&(f.pmax===''||pr<=+f.pmax)&&(!f.stock||stockOf(p.id).qty>0)})
   .map(function(x){x.s=x.r*30+prodStd(x.p).score*.3+merStd(L(x.p.sup)).score*.2+Math.log(1+soldOf(x.p.id))/Math.LN10*5;return x});
}
function shopRun(q,items){
  var ws=String(q).toLowerCase().split(/\s+/).filter(Boolean),sup={};items.forEach(function(x){sup[x.p.sup]=1});
  return S.listings.filter(function(l){if(!merOk(l))return false;if(sup[l.id])return true;var h=(allL(l.name)+' '+allL(l.svc)+' '+t(l.type)).toLowerCase();return ws.every(function(w){return expandQ(w).some(function(x){return h.indexOf(x)>=0})})})
   .sort(function(a,b){return merStd(b).score-merStd(a).score});
}
function doSearch(q,cat){
  q=String(q==null?(ui.sq||''):q).trim();if(!q)return;ensureAI();
  S.shist=[q].concat(S.shist.filter(function(x){return x!==q})).slice(0,10);S.sq[q]=(S.sq[q]||0)+1;
  ui.sq=q;ui.sres=q;ui.sf={cat:cat||'all',org:'all',pmin:'',pmax:'',stock:false};ui.sfo=false;ui.ssort='all';ui.stab='item';
  var res=searchRun(q,ui.sf);track('search',{q:q.slice(0,30),n:res.length});
  if(ui.role==='owner'){var cs={};res.sort(function(a,b){return b.s-a.s}).slice(0,3).forEach(function(x){cs[x.p.cat]=1});Object.keys(cs).forEach(function(c){addTag('o','cat:'+c,'search',1)})}
  ui.sload=true;save();render();setTimeout(function(){ui.sload=false;render()},350);
}
function hotList(){
  var m={};HOT0.forEach(function(h){var k=h[0].split(':'),x=k[0]==='c'?String(t(k[1])):(PR(+k[1])?String(tx(PR(+k[1]).name)):'');if(x)m[x]=(m[x]||0)+h[1]});
  Object.keys(S.sq).forEach(function(k){m[k]=(m[k]||0)+S.sq[k]*20});
  return Object.keys(m).sort(function(a,b){return m[b]-m[a]}).slice(0,10);
}
function suggests(q){
  var ql=q.toLowerCase(),c=[],seen={},re=lang==='zh'?/[一-鿿]/:lang==='km'?/[ក-៿]/:/^[a-z]/i,ex=expandQ(ql);
  function add(x,cat){x=String(x);var xl=x.toLowerCase();if(seen[x]||xl===ql)return;if(xl.indexOf(ql)>=0||ex.indexOf(xl)>=0){seen[x]=1;c.push({x:x,cat:cat})}}
  catList().forEach(function(k){add(t(k),k)});
  S.products.filter(prodOk).forEach(function(p){add(tx(p.name))});
  SYN.forEach(function(g){g.forEach(function(x){if(re.test(x))add(x)})});
  S.listings.filter(merOk).forEach(function(l){add(tx(l.name))});
  return c.slice(0,8);
}

function legalDef(){
  var ex={"privacy": {"zh": "DR.LIFE+ 隐私政策\n版本 1.0 · 生效日期 2026-10-09\n\n1. 我们是谁\n本政策适用于 DR.LIFE+（以下简称“我们”）的买家、商家、司机 Mini App 及相关服务。运营主体：[公司名称，须填写]；联系方式：https://settlecore.org/contact。\n\n2. 我们收集哪些信息\n① Telegram 用户编号、昵称、界面语言；② 你提供的资料：姓名、手机号、地址、企业资料；③ 交易与资金记录：订单、付款凭证、钱包流水、提现账户；④ 使用信息：设备、页面访问、点击等（用匿名编号记录）；⑤ AI 聊天内容，以及由此总结的基础信息和兴趣标签；⑥ 你上传的照片和凭证；⑦ 司机端在执行任务期间的位置。\n\n3. 我们如何使用\n提供和改进服务；处理订单、配送、结算与对账；发送订单和资金通知；风险控制和合规审计；根据你的兴趣推荐商品。\n\n4. AI 与画像\nAI 聊天会记录你的基础信息（如城市、房屋类型、面积、预算）和喜欢标签，仅用于给你推荐商品，你可以随时查看、修改、删除。画像只保存标签和匿名编号，不含聊天原文。调用外部 AI 接口（DeepSeek、OpenAI ChatGPT）前，我们会先去掉手机号、地址、账号等个人信息，并要求服务方不得将内容用于训练；我们也使用自建的 Ollama 服务。画像默认不用于广告定向，如需使用会另行征得你的同意。\n\n5. 信息共享\n为完成服务，我们会向以下对象提供必要信息：合作银行（资金托管与出款）、中通及配送方、报关行、实名认证服务商、经你授权的金融机构、Telegram（消息发送）。除法律要求外，我们不出售你的个人信息。\n\n6. 跨境传输\n数据存放在 [服务器所在地，须填写]；调用外部 AI 接口时，已去除个人信息的内容可能在境外处理。\n\n7. 保存期限\n账务和审计记录按法律法规长期保留；使用行为记录约保留 13 个月；AI 聊天原文加密保存 [保存期限，须确认]；达到期限或你申请删除后，我们会删除或匿名化。\n\n8. 你的权利\n你可以查看、更正、删除你的个人信息，撤回同意，申请导出，申请注销账号。方式：应用内“我的”页面，或通过官网联系我们。法律要求保留的账务数据，我们只做匿名化处理。\n\n9. 安全措施\n传输全程加密；高敏信息加密存储；后台按权限访问并留下审计日志；账号提现等高风险操作需要额外验证。\n\n10. 未成年人\n未满 [年龄，须律师确认] 周岁的用户需在监护人同意下使用。\n\n11. 通知\n我们通过 Telegram Bot 向你发送订单和资金通知；营销类通知默认关闭，你可以随时在设置中调整。\n\n12. 政策变更\n本政策带有版本号和生效日期。发布新版本后，你会被要求重新阅读并同意。\n\n13. 联系与投诉\nhttps://settlecore.org/contact", "en": "DR.LIFE+ Privacy Policy\nVersion 1.0 · Effective 2026-10-09\n\n1. Who we are\nThis policy applies to the buyer, merchant and driver Mini Apps and related services of DR.LIFE+ (“we”). Operator: [company name, to be filled in]. Contact: https://settlecore.org/contact.\n\n2. What we collect\n(1) Telegram user ID, name and interface language; (2) information you provide: name, phone number, address, business details; (3) transaction and funds records: orders, payment proof, wallet entries, withdrawal accounts; (4) usage information: device, page views and clicks (recorded under a pseudonymous ID); (5) AI chat content and the basic information and interest tags summarised from it; (6) photos and proofs you upload; (7) drivers’ location while performing tasks.\n\n3. How we use it\nTo provide and improve the service; to process orders, delivery, settlement and reconciliation; to send order and funds notifications; for risk control and compliance audit; and to recommend products based on your interests.\n\n4. AI and profiling\nAI chat records your basic information (such as city, property type, area and budget) and interest tags, used only to recommend products to you; you can view, edit and delete them at any time. Profiles hold tags and pseudonymous IDs only, never raw chat text. Before calling external AI services (DeepSeek, OpenAI ChatGPT) we remove phone numbers, addresses and account numbers, and require providers not to use content for training; we also run a self-hosted Ollama service. Profiles are not used for ad targeting by default; any such use would require your separate consent.\n\n5. Sharing\nTo deliver the service we share necessary information with: the partner bank (fund custody and payouts), ZTO and delivery partners, customs brokers, identity-verification providers, financial institutions you authorise, and Telegram (message delivery). We do not sell your personal information except where required by law.\n\n6. Cross-border transfer\nData is stored in [server location, to be filled in]; when external AI services are used, content with personal information removed may be processed abroad.\n\n7. Retention\nAccounting and audit records are kept long-term as required by law; usage records about 13 months; AI chat text is stored encrypted for [retention period, to be confirmed]; after the period, or after you request deletion, we delete or anonymise it.\n\n8. Your rights\nYou may view, correct and delete your personal information, withdraw consent, request an export and request account deletion — in the app under “Me”, or through the website. Accounting data that the law requires us to keep is anonymised only.\n\n9. Security\nEncryption in transit; encrypted storage for highly sensitive data; back-office access by permission with audit logs; extra verification for high-risk actions such as withdrawals.\n\n10. Minors\nUsers under [age, to be confirmed by a lawyer] may use the service only with a guardian’s consent.\n\n11. Notifications\nWe send order and funds notifications through Telegram bots; marketing notifications are off by default and can be changed in settings.\n\n12. Changes\nThis policy carries a version number and an effective date. After a new version is published you will be asked to read and agree again.\n\n13. Contact and complaints\nhttps://settlecore.org/contact", "km": "គោលការណ៍ឯកជនភាព DR.LIFE+\nកំណែ 1.0 · មានប្រសិទ្ធភាព 2026-10-09\n\n១. យើងជានរណា\nគោលការណ៍នេះអនុវត្តចំពោះ Mini App អ្នកទិញ អ្នកលក់ អ្នកបើកបរ និងសេវាពាក់ព័ន្ធរបស់ DR.LIFE+ (ហៅថា «យើង»)។ ប្រតិបត្តិករ៖ [ឈ្មោះក្រុមហ៊ុន ត្រូវបំពេញ]។ ទំនាក់ទំនង៖ https://settlecore.org/contact។\n\n២. ព័ត៌មានដែលយើងប្រមូល\n១) លេខអ្នកប្រើ Telegram ឈ្មោះ និងភាសា ២) ព័ត៌មានដែលអ្នកផ្តល់៖ ឈ្មោះ លេខទូរស័ព្ទ អាសយដ្ឋាន ព័ត៌មានអាជីវកម្ម ៣) កំណត់ត្រាប្រតិបត្តិការ និងប្រាក់៖ ការបញ្ជាទិញ ភស្តុតាងបង់ប្រាក់ ចលនាកាបូប គណនីដកប្រាក់ ៤) ព័ត៌មានប្រើប្រាស់៖ ឧបករណ៍ ទំព័រដែលបានមើល ការចុច (កត់ត្រាដោយលេខអនាមិក) ៥) ខ្លឹមសារជជែកជាមួយ AI និងព័ត៌មានមូលដ្ឋាន និងស្លាកចំណូលចិត្តដែលសង្ខេបពីវា ៦) រូបថត និងភស្តុតាងដែលអ្នកផ្ទុកឡើង ៧) ទីតាំងរបស់អ្នកបើកបរក្នុងអំឡុងពេលអនុវត្តភារកិច្ច។\n\n៣. យើងប្រើប្រាស់យ៉ាងដូចម្តេច\nដើម្បីផ្តល់ និងកែលម្អសេវា ដំណើរការការបញ្ជាទិញ ការដឹកជញ្ជូន ការទូទាត់ និងការផ្ទៀងផ្ទាត់ ផ្ញើការជូនដំណឹងអំពីការបញ្ជាទិញ និងប្រាក់ គ្រប់គ្រងហានិភ័យ និងសវនកម្ម និងណែនាំទំនិញតាមចំណូលចិត្តរបស់អ្នក។\n\n៤. AI និងប្រវត្តិរូប\nការជជែកជាមួយ AI កត់ត្រាព័ត៌មានមូលដ្ឋានរបស់អ្នក (ដូចជា ទីក្រុង ប្រភេទផ្ទះ ទំហំ ថវិកា) និងស្លាកចំណូលចិត្ត ដើម្បីណែនាំទំនិញឱ្យអ្នកប៉ុណ្ណោះ អ្នកអាចមើល កែ និងលុបបានគ្រប់ពេល។ ប្រវត្តិរូបរក្សាទុកតែស្លាក និងលេខអនាមិក មិនមានអត្ថបទជជែកដើមទេ។ មុនហៅសេវា AI ខាងក្រៅ (DeepSeek, OpenAI ChatGPT) យើងលុបលេខទូរស័ព្ទ អាសយដ្ឋាន និងលេខគណនីចេញ ហើយតម្រូវឱ្យអ្នកផ្តល់សេវាមិនប្រើខ្លឹមសារដើម្បីបណ្តុះបណ្តាល។ យើងក៏ប្រើសេវា Ollama ដែលដំឡើងដោយខ្លួនឯង។ ប្រវត្តិរូបមិនត្រូវបានប្រើសម្រាប់កំណត់គោលដៅផ្សាយពាណិជ្ជកម្មតាមលំនាំដើមទេ ប្រសិនបើត្រូវប្រើ យើងនឹងសុំការយល់ព្រមដោយឡែក។\n\n៥. ការចែករំលែកព័ត៌មាន\nដើម្បីផ្តល់សេវា យើងផ្តល់ព័ត៌មានចាំបាច់ដល់៖ ធនាគារដៃគូ (រក្សាទុកប្រាក់ និងការដកប្រាក់) ក្រុមហ៊ុន ZTO និងដៃគូដឹកជញ្ជូន ភ្នាក់ងារគយ អ្នកផ្តល់សេវាផ្ទៀងផ្ទាត់អត្តសញ្ញាណ គ្រឹះស្ថានហិរញ្ញវត្ថុដែលអ្នកអនុញ្ញាត និង Telegram (ការផ្ញើសារ)។ លើកលែងតែច្បាប់តម្រូវ យើងមិនលក់ព័ត៌មានផ្ទាល់ខ្លួនរបស់អ្នកឡើយ។\n\n៦. ការផ្ទេរទិន្នន័យឆ្លងដែន\nទិន្នន័យរក្សាទុកនៅ [ទីតាំងម៉ាស៊ីនបម្រើ ត្រូវបំពេញ]។ ពេលប្រើសេវា AI ខាងក្រៅ ខ្លឹមសារដែលបានលុបព័ត៌មានផ្ទាល់ខ្លួនអាចត្រូវបានដំណើរការនៅបរទេស។\n\n៧. រយៈពេលរក្សាទុក\nកំណត់ត្រាគណនេយ្យ និងសវនកម្មរក្សាទុកយូរតាមច្បាប់។ កំណត់ត្រាប្រើប្រាស់ប្រហែល ១៣ ខែ។ អត្ថបទជជែក AI រក្សាទុកដោយអ៊ិនគ្រីបរយៈពេល [រយៈពេល ត្រូវបញ្ជាក់]។ ពេលដល់កំណត់ ឬអ្នកស្នើសុំលុប យើងលុប ឬធ្វើឱ្យអនាមិក។\n\n៨. សិទ្ធិរបស់អ្នក\nអ្នកអាចមើល កែ និងលុបព័ត៌មានផ្ទាល់ខ្លួន ដកការយល់ព្រម ស្នើសុំនាំចេញ និងស្នើសុំលុបគណនី តាមកម្មវិធីនៅទំព័រ «ខ្ញុំ» ឬតាមគេហទំព័រ។ ទិន្នន័យគណនេយ្យដែលច្បាប់តម្រូវឱ្យរក្សា យើងធ្វើឱ្យអនាមិកតែប៉ុណ្ណោះ។\n\n៩. វិធានការសុវត្ថិភាព\nអ៊ិនគ្រីបពេលបញ្ជូន អ៊ិនគ្រីបព័ត៌មានរសើបខ្ពស់ពេលរក្សាទុក ការចូលប្រើផ្នែកខាងក្រោយតាមសិទ្ធិ និងមានកំណត់ត្រាសវនកម្ម សកម្មភាពហានិភ័យខ្ពស់ដូចជាការដកប្រាក់ត្រូវមានការផ្ទៀងផ្ទាត់បន្ថែម។\n\n១០. អនីតិជន\nអ្នកប្រើដែលមានអាយុក្រោម [អាយុ ត្រូវបញ្ជាក់ដោយអ្នកច្បាប់] ឆ្នាំ អាចប្រើបានលុះត្រាតែមានការយល់ព្រមពីអាណាព្យាបាល។\n\n១១. ការជូនដំណឹង\nយើងផ្ញើការជូនដំណឹងអំពីការបញ្ជាទិញ និងប្រាក់តាម Telegram Bot។ ការជូនដំណឹងផ្នែកទីផ្សារបិទតាមលំនាំដើម ហើយអ្នកអាចកែក្នុងការកំណត់។\n\n១២. ការផ្លាស់ប្តូរគោលការណ៍\nគោលការណ៍នេះមានលេខកំណែ និងកាលបរិច្ឆេទមានប្រសិទ្ធភាព។ ពេលមានកំណែថ្មី អ្នកនឹងត្រូវបានស្នើឱ្យអាន និងយល់ព្រមម្តងទៀត។\n\n១៣. ទំនាក់ទំនង និងបណ្តឹង\nhttps://settlecore.org/contact"}, "terms": {"zh": "DR.LIFE+ 用户协议\n版本 1.0 · 生效日期 2026-10-09\n\n1. 服务说明\nDR.LIFE+（以下简称“平台”）通过 Telegram Mini App 提供建材装修商品展示、商家入仓与配送、订单与资金记录等服务。\n\n2. 账号\n你通过 Telegram 账号登录。每个人在每种角色（买家、商家、司机）下各有一个账号。请提供真实信息，保管好账号，不得转让他人。商家老板可以添加员工，并对员工的操作负责。\n\n3. 平台角色与边界\n平台是信息与服务平台。买家与商家之间的货款在平台之外支付，平台只记录付款凭证。平台不放贷，不提供担保。\n\n4. 费用\n平台销售佣金为 0%，结算服务费为 0。仓储费按体积计费（美元/立方米/月），以平台公示的价格为准。配送费由商家在发货时预付并托管，买家签收后分账。平台不向司机收取任何费用。费用调整会提前通知。\n\n5. 资金\n钱包资金由合作银行的专用账户持有，平台不动用。冻结、分批结算和提现按应用内规则执行，可能需要复核或额外验证。\n\n6. 订单、配送与签收\n签收需要凭证（照片、签名或验证码），平台据此分账。出现问题可申请售后（退款、退货或破损赔付）。\n\n7. 商品与内容\n禁止发布违禁或违法商品。信息必须真实。导入的商品须拥有商品信息和图片的使用权。违规内容可能被下架，账号可能被限制。\n\n8. AI 功能\nAI 的回答仅供参考，不构成金融或法律建议。每月有免费使用额度，超出后可购买会员继续使用。禁止滥用。\n\n9. 广告\n广告一律标注“广告”，不影响自然排序。\n\n10. 责任限制\n在法律允许的范围内，对因不可抗力（如 Telegram 网络故障、自然灾害）或第三方行为造成的损失，平台不承担责任。\n\n11. 账号冻结与终止\n账号违反本协议或存在风险时，平台可以冻结或停用，并说明原因。\n\n12. 协议变更\n本协议带有版本号和生效日期。发布新版本后，你会被要求重新阅读并同意。\n\n13. 适用法律与争议\n本协议适用柬埔寨王国法律。争议先协商解决，协商不成的，提交 [有管辖权的法院，须律师确认]。\n\n14. 联系我们\nhttps://settlecore.org/contact", "en": "DR.LIFE+ User Agreement\nVersion 1.0 · Effective 2026-10-09\n\n1. The service\nDR.LIFE+ (the “Platform”) provides, through Telegram Mini Apps, product listings for building and decoration materials, merchant warehousing and delivery, and order and funds records.\n\n2. Accounts\nYou sign in with your Telegram account. Each person has one account per role (buyer, merchant, driver). Provide true information, keep your account secure and do not transfer it. A merchant owner may add staff and is responsible for their actions.\n\n3. Role and limits of the Platform\nThe Platform is an information and service platform. Payment for goods between buyer and merchant is made outside the Platform; the Platform only records payment proof. The Platform does not lend and does not guarantee.\n\n4. Fees\nSales commission is 0% and the settlement service fee is 0. Storage is billed by volume (USD per cubic metre per month) at the published price. Delivery fees are prepaid by the merchant when goods are shipped and held in escrow, then split after the buyer signs for the goods. The Platform charges drivers nothing. Fee changes are announced in advance.\n\n5. Funds\nWallet funds are held in a dedicated account at a partner bank and are not used by the Platform. Freezing, staged settlement and withdrawals follow the in-app rules and may require review or extra verification.\n\n6. Orders, delivery and receipt\nReceipt requires proof (photo, signature or code), on which the delivery fee split is based. If there is a problem you can request after-sales service (refund, return or damage compensation).\n\n7. Products and content\nProhibited or unlawful goods must not be listed. Information must be true. Imported products require the right to use the product information and images. Violating content may be removed and accounts restricted.\n\n8. AI features\nAI answers are for reference only and are not financial or legal advice. A monthly free allowance applies; you can buy a membership to continue. Abuse is prohibited.\n\n9. Advertising\nAds are always labelled “Ad” and do not affect organic ranking.\n\n10. Limitation of liability\nTo the extent permitted by law, the Platform is not liable for losses caused by events beyond its control (such as Telegram outages or natural disasters) or by third parties.\n\n11. Account freezing and termination\nIf an account breaches this agreement or poses risk, the Platform may freeze or disable it and will state the reason.\n\n12. Changes\nThis agreement carries a version number and an effective date. After a new version is published you will be asked to read and agree again.\n\n13. Governing law and disputes\nThis agreement is governed by the laws of the Kingdom of Cambodia. Disputes are first resolved by negotiation, failing which they go to [competent court, to be confirmed by a lawyer].\n\n14. Contact us\nhttps://settlecore.org/contact", "km": "កិច្ចព្រមព្រៀងអ្នកប្រើ DR.LIFE+\nកំណែ 1.0 · មានប្រសិទ្ធភាព 2026-10-09\n\n១. សេវាកម្ម\nDR.LIFE+ (ហៅថា «វេទិកា») ផ្តល់សេវាតាម Telegram Mini App រួមមាន ការបង្ហាញទំនិញសំណង់ និងតុបតែង ការដាក់ទំនិញក្នុងឃ្លាំង និងការដឹកជញ្ជូន ការកត់ត្រាការបញ្ជាទិញ និងប្រាក់។\n\n២. គណនី\nអ្នកចូលតាមគណនី Telegram។ មនុស្សម្នាក់មានគណនីមួយក្នុងតួនាទីនីមួយៗ (អ្នកទិញ អ្នកលក់ អ្នកបើកបរ)។ សូមផ្តល់ព័ត៌មានពិត រក្សាសុវត្ថិភាពគណនី និងមិនផ្ទេរឱ្យអ្នកដទៃ។ ម្ចាស់ហាងអាចបន្ថែមបុគ្គលិក ហើយទទួលខុសត្រូវចំពោះសកម្មភាពរបស់បុគ្គលិក។\n\n៣. តួនាទី និងព្រំដែនវេទិកា\nវេទិកាជាកន្លែងផ្តល់ព័ត៌មាន និងសេវា។ ការបង់ប្រាក់ទំនិញរវាងអ្នកទិញ និងអ្នកលក់ធ្វើក្រៅវេទិកា វេទិកាគ្រាន់តែកត់ត្រាភស្តុតាងបង់ប្រាក់។ វេទិកាមិនផ្តល់កម្ចី និងមិនធានាឡើយ។\n\n៤. ថ្លៃសេវា\nកម្រៃលក់ ០% ថ្លៃសេវាទូទាត់ ០។ ថ្លៃឃ្លាំងគិតតាមមាឌ (ដុល្លារ/ម៉ែត្រគូប/ខែ) តាមតម្លៃដែលបានបង្ហាញ។ ថ្លៃដឹកជញ្ជូនត្រូវបង់ជាមុនដោយអ្នកលក់ពេលបញ្ជូនទំនិញ ទុកជាប្រាក់បញ្ញើ ហើយបែងចែកបន្ទាប់ពីអ្នកទិញទទួលទំនិញ។ វេទិកាមិនយកថ្លៃពីអ្នកបើកបរ។ ការផ្លាស់ប្តូរថ្លៃនឹងជូនដំណឹងជាមុន។\n\n៥. ប្រាក់\nប្រាក់ក្នុងកាបូបរក្សាទុកក្នុងគណនីឯកទេសនៅធនាគារដៃគូ វេទិកាមិនយកទៅប្រើឡើយ។ ការបង្កក ការទូទាត់ជាដំណាក់កាល និងការដកប្រាក់ធ្វើតាមវិធានក្នុងកម្មវិធី ហើយអាចត្រូវការការត្រួតពិនិត្យ ឬការផ្ទៀងផ្ទាត់បន្ថែម។\n\n៦. ការបញ្ជាទិញ ការដឹក និងការទទួល\nការទទួលទំនិញត្រូវមានភស្តុតាង (រូបថត ហត្ថលេខា ឬលេខកូដ) ដើម្បីបែងចែកថ្លៃដឹកជញ្ជូន។ បើមានបញ្ហា អ្នកអាចស្នើសេវាក្រោយការលក់ (សងប្រាក់ ប្រគល់ទំនិញ ឬសំណងខូចខាត)។\n\n៧. ទំនិញ និងខ្លឹមសារ\nហាមដាក់លក់ទំនិញដែលត្រូវហាមឃាត់ ឬខុសច្បាប់។ ព័ត៌មានត្រូវពិត។ ទំនិញដែលនាំចូលត្រូវមានសិទ្ធិប្រើព័ត៌មាន និងរូបភាព។ ខ្លឹមសារដែលរំលោភអាចត្រូវបានដកចេញ ហើយគណនីអាចត្រូវបានដាក់កម្រិត។\n\n៨. មុខងារ AI\nចម្លើយ AI សម្រាប់យោងប៉ុណ្ណោះ មិនមែនជាយោបល់ហិរញ្ញវត្ថុ ឬច្បាប់ឡើយ។ មានចំនួនសារឥតគិតថ្លៃប្រចាំខែ ហើយអាចទិញសមាជិកភាពដើម្បីប្រើបន្ត។ ហាមប្រើបំពាន។\n\n៩. ពាណិជ្ជកម្ម\nការផ្សាយពាណិជ្ជកម្មត្រូវមានស្លាក «ពាណិជ្ជកម្ម» ហើយមិនប៉ះពាល់ដល់លំដាប់ធម្មជាតិឡើយ។\n\n១០. ការកំណត់ការទទួលខុសត្រូវ\nក្នុងដែនកំណត់ដែលច្បាប់អនុញ្ញាត វេទិកាមិនទទួលខុសត្រូវចំពោះការខាតបង់ដោយសារហេតុដែលហួសពីការគ្រប់គ្រង (ដូចជា បណ្តាញ Telegram ដាច់ ឬគ្រោះធម្មជាតិ) ឬដោយសារភាគីទីបី។\n\n១១. ការបង្កក និងបិទគណនី\nបើគណនីរំលោភកិច្ចព្រមព្រៀងនេះ ឬមានហានិភ័យ វេទិកាអាចបង្កក ឬបិទគណនី ហើយនឹងបញ្ជាក់មូលហេតុ។\n\n១២. ការផ្លាស់ប្តូរកិច្ចព្រមព្រៀង\nកិច្ចព្រមព្រៀងនេះមានលេខកំណែ និងកាលបរិច្ឆេទមានប្រសិទ្ធភាព។ ពេលមានកំណែថ្មី អ្នកនឹងត្រូវបានស្នើឱ្យអាន និងយល់ព្រមម្តងទៀត។\n\n១៣. ច្បាប់អនុវត្ត និងវិវាទ\nកិច្ចព្រមព្រៀងនេះអនុវត្តតាមច្បាប់នៃព្រះរាជាណាចក្រកម្ពុជា។ វិវាទត្រូវដោះស្រាយដោយការចរចាជាមុន បើមិនបានទេ ត្រូវបញ្ជូនទៅ [តុលាការមានសមត្ថកិច្ច ត្រូវបញ្ជាក់ដោយអ្នកច្បាប់]។\n\n១៤. ទំនាក់ទំនងយើង\nhttps://settlecore.org/contact"}};
