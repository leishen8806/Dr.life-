# Claude 独立审核（#185）：以 Claude GitHub App 身份发出审核，与实现者账号分开。
# 只审核、只评论：不推代码、不批准、不合并。批准与合并只认 leishen8806（docs/ops/DISPATCH.md 第七节）。
# 需要 owner 先安装 Claude GitHub App，并在 Settings → Secrets and variables → Actions 添加 CLAUDE_CODE_OAUTH_TOKEN。
name: Claude Review

on:
  pull_request:
    types: [ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # 公开仓库：只响应仓库成员或协作者的 @claude，防止外人消耗额度；草稿 PR 不自动审核；fork 来的 PR 拿不到密钥，不运行。
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 并发控制放在 job 上：不满足 if 的评论（Codex 回复、claude[bot] 自己发的审核）不会占用并发组，
    # 也就不会取消正在进行的审核；同一 PR 的审核排队执行，不互相取消。
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Write,Grep,Glob"
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || github.event.issue.number }}

            你是 Dr.life+ 仓库的独立审核员。用中文审核上面这张 PR 的最新 head。
            工作区可能是 main 而不是 PR 的代码：先用 `gh pr view` 取 PR 描述、关联 Issue 和最新 head，
            再用 `gh pr diff` 读取改动；仓库里的 AGENTS.md、docs/ops/DISPATCH.md 直接读取。
            对照：Issue 验收项；AGENTS.md 第 4 节不可违反的规则；已定决定（金额 e4 整分、
            确认中订单不可取消返回 409、报价过期 409/3006、商家端电话脱敏、买家端不出现 RouteFit、
            三语齐全、官网 CSP 不放宽、不写入服务器地址/密钥/令牌）。
            发审核的方法固定为两步，不要用管道、heredoc、cat 或 echo：
            第一步用 Write 工具把审核全文写到 /tmp/claude-review.md；
            第二步运行一条命令：gh pr comment <PR 编号> --body-file /tmp/claude-review.md
            需要逐行指出的再用行内评论工具。审核开头写“## Claude 独立审核 · PR #<编号>（head <短哈希>）”，
            按“必须修 / 应修 / 低”分级，每条写清位置、原因、怎么改。分级标准（docs/ops/DISPATCH.md 七-A）：
            必须修只限：违反 AGENTS.md 第 4 节或已定决定、Issue 验收项未达成、会导致错误结果或安全问题；
            其余改进建议一律放应修或低。因环境或外部条件无法执行、且写明原因的 NOT_RUN（如缺浏览器截图），
            单列在“阻塞（不需返工）”里，不算必须修。
            复审规则：先用 `gh pr view <PR 编号> --comments` 读本 PR 之前的 Claude 独立审核和作者回复；
            只对上次审核之后的新改动提出新问题；之前提过、作者已回复的不再重复；
            没有改动的旧代码，除非发现必须修，不再提新的应修。
            审核正文第二行固定写结论，二选一：
            “**结论：无必须修，停止返工，可交 owner 复审。**”或“**结论：有 N 项必须修，需返工。**”
            结论为无必须修时，把应修和低放在“后续卡建议”小节，并写明“不需要在本 PR 返工”。
            只评论：不要推送代码、不要批准、不要合并、不要请求修改状态以外的任何操作。
            结束前确认审核已经发出；没发出就重试上面第二步一次。
            涉及资金、登录权限、数据库迁移的改动，在结论里注明“需 owner 亲审”。
