name: Website

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/website/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @drlife/website lint
      - name: Type check
        run: pnpm --filter @drlife/website typecheck
      - name: Test
        run: pnpm --filter @drlife/website test
      - name: Build three-language static site
        run: pnpm --filter @drlife/website build
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist
          if-no-files-found: error
          retention-days: 14

  deployment-gate:
    name: Check production deployment configuration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.configuration.outputs.ready }}
    steps:
      - id: configuration
        env:
          WEBSITE_DEPLOY_HOST: ${{ secrets.WEBSITE_DEPLOY_HOST }}
          WEBSITE_DEPLOY_USER: ${{ secrets.WEBSITE_DEPLOY_USER }}
          WEBSITE_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_PRIVATE_KEY }}
          WEBSITE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEBSITE_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -n "$WEBSITE_DEPLOY_HOST" ] && [ -n "$WEBSITE_DEPLOY_USER" ] && [ -n "$WEBSITE_DEPLOY_SSH_PRIVATE_KEY" ] && [ -n "$WEBSITE_DEPLOY_KNOWN_HOSTS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-production:
    name: Deploy production
    if: needs.deployment-gate.outputs.ready == 'true'
    needs: [build, deployment-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: website-production
    steps:
      - name: Download approved build artifact
        uses: actions/download-artifact@v5
        with:
          name: website-dist
          path: website-dist
      - name: Atomically publish approved artifact to VPS
        env:
          WEBSITE_DEPLOY_HOST: ${{ secrets.WEBSITE_DEPLOY_HOST }}
          WEBSITE_DEPLOY_USER: ${{ secrets.WEBSITE_DEPLOY_USER }}
          WEBSITE_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_PRIVATE_KEY }}
          WEBSITE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEBSITE_DEPLOY_KNOWN_HOSTS }}
          WEBSITE_RELEASE_SUFFIX: ${{ github.run_id }}-${{ github.sha }}
        run: |
          set -eu
          release_id="$(date -u +%Y%m%dT%H%M%SZ)-$WEBSITE_RELEASE_SUFFIX"
          key="$RUNNER_TEMP/website-deploy-key"
          known_hosts="$RUNNER_TEMP/website-known-hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$WEBSITE_DEPLOY_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$WEBSITE_DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          remote="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          target="$WEBSITE_DEPLOY_USER@$WEBSITE_DEPLOY_HOST"
          $remote "$target" "mkdir -p /srv/drlifeplus/incoming/$release_id"
          rsync -a --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "$remote" website-dist/ "$target:/srv/drlifeplus/incoming/$release_id/"
          $remote "$target" "sudo /usr/local/sbin/drlifeplus-website-publish $release_id"
