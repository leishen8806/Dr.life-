name: Website

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/website/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @drlife/website lint
      - name: Type check
        run: pnpm --filter @drlife/website typecheck
      - name: Test
        run: pnpm --filter @drlife/website test
      - name: Build three-language static site
        run: pnpm --filter @drlife/website build
      - name: Restore last successful deployment hash
        uses: actions/cache/restore@v4
        with:
          path: .website-cache
          key: website-dist-hash-main-${{ github.run_id }}
          restore-keys: |
            website-dist-hash-main-
      - name: Compare static output with last successful deployment
        id: compare-dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .website-cache
          current_hash="$(find apps/website/dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          previous_hash=""
          if [ -f .website-cache/dist.sha256 ]; then
            previous_hash="$(cat .website-cache/dist.sha256)"
          fi
          printf '%s\n' "$current_hash" > website-dist-hash.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$current_hash" != "$previous_hash" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'Current website dist hash: %s\nPrevious successful deployment hash: %s\n' "$current_hash" "${previous_hash:-<none>}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload deployment hash
        uses: actions/upload-artifact@v4
        with:
          name: website-dist-hash
          path: website-dist-hash.txt
          if-no-files-found: error
          retention-days: 14

    outputs:
      changed: ${{ steps.compare-dist.outputs.changed }}

  screenshots:
    name: Website screenshot evidence
    if: github.event_name != 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download static artifact
        uses: actions/download-artifact@v5
        with:
          name: website-dist
          path: apps/website/dist
      - name: Install Chromium for screenshot evidence
        run: pnpm --filter @drlife/website exec playwright install --with-deps chromium
      - name: Capture responsive language screenshots
        run: pnpm --filter @drlife/website exec node scripts/capture-screenshots.mjs
      - name: Capture Mini App screenshot matrix
        run: pnpm --filter @drlife/website capture:miniapp-screenshots
      - name: Summarize screenshot files
        if: always()
        run: |
          {
            echo '## Website screenshot evidence'
            echo
            echo 'Matrix: 11 widths × 3 languages × 2 pages = 66 screenshots.'
            echo
            echo '```text'
            test -f apps/website/screenshots/manifest.txt && cat apps/website/screenshots/manifest.txt || true
            echo
            echo 'Mini App matrix: buyer home/orders + merchant home × 2 widths × 2 themes × 3 languages = 36 screenshots.'
            test -f apps/website/screenshots-miniapp/manifest.txt && cat apps/website/screenshots-miniapp/manifest.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshots
          path: apps/website/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Mini App screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-screenshots
          path: apps/website/screenshots-miniapp
          if-no-files-found: warn
          retention-days: 14

  deploy-production:
    name: Deploy production
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.build.outputs.changed == 'true'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: website-production
    steps:
      - name: Check required production deployment secrets
        env:
          WEBSITE_DEPLOY_HOST: ${{ secrets.WEBSITE_DEPLOY_HOST }}
          WEBSITE_DEPLOY_USER: ${{ secrets.WEBSITE_DEPLOY_USER }}
          WEBSITE_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_PRIVATE_KEY }}
          WEBSITE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEBSITE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing_secrets=()
          for secret_name in \
            WEBSITE_DEPLOY_HOST \
            WEBSITE_DEPLOY_USER \
            WEBSITE_DEPLOY_SSH_PRIVATE_KEY \
            WEBSITE_DEPLOY_KNOWN_HOSTS
          do
            if [ -z "${!secret_name-}" ]; then
              missing_secrets+=("$secret_name")
            fi
          done
          if [ "${#missing_secrets[@]}" -ne 0 ]; then
            printf '::error::Missing required deployment secret(s): %s\n' "$(IFS=,; echo "${missing_secrets[*]}")"
            exit 1
          fi
      - name: Download approved build artifact
        uses: actions/download-artifact@v5
        with:
          name: website-dist
          path: website-dist
      - name: Download deployment hash
        uses: actions/download-artifact@v5
        with:
          name: website-dist-hash
          path: .
      - name: Normalize deployment hash for the next comparison
        run: |
          set -euo pipefail
          mkdir -p .website-cache
          cp website-dist-hash.txt .website-cache/dist.sha256
      - name: Atomically publish approved artifact to VPS
        env:
          WEBSITE_DEPLOY_HOST: ${{ secrets.WEBSITE_DEPLOY_HOST }}
          WEBSITE_DEPLOY_USER: ${{ secrets.WEBSITE_DEPLOY_USER }}
          WEBSITE_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_PRIVATE_KEY }}
          WEBSITE_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEBSITE_DEPLOY_KNOWN_HOSTS }}
          WEBSITE_RELEASE_SUFFIX: ${{ github.run_id }}-${{ github.sha }}
        run: |
          set -eu
          release_id="$(date -u +%Y%m%dT%H%M%SZ)-$WEBSITE_RELEASE_SUFFIX"
          key="$RUNNER_TEMP/website-deploy-key"
          known_hosts="$RUNNER_TEMP/website-known-hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$WEBSITE_DEPLOY_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$WEBSITE_DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          remote="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          target="$WEBSITE_DEPLOY_USER@$WEBSITE_DEPLOY_HOST"
          $remote "$target" "mkdir -p /srv/drlifeplus/incoming/$release_id"
          rsync -a --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "$remote" website-dist/ "$target:/srv/drlifeplus/incoming/$release_id/"
          $remote "$target" "sudo /usr/local/sbin/drlifeplus-website-publish $release_id"
      - name: Verify published website content
        env:
          WEBSITE_ORIGIN: https://drlifeplus.com
        run: bash .github/scripts/verify-published-website.sh

      - name: Record successful deployment hash
        uses: actions/cache/save@v4
        with:
          path: .website-cache
          key: website-dist-hash-main-${{ github.run_id }}
