name: Staging deploy

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build staging image
        run: docker build -f backend/Dockerfile -t drlife-api:${{ inputs.release }} ./backend
      - name: Validate compose template
        run: docker compose --env-file deploy/staging/env.example -f deploy/staging/compose.yaml config --quiet
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v6
      - name: Publish through Cloudflare Tunnel
        env:
          STAGING_SSH_TARGET: ${{ secrets.STAGING_SSH_TARGET }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          test -n "$STAGING_SSH_TARGET" -a -n "$STAGING_SSH_KEY"
          echo "Deployment is intentionally approval-gated and uses owner-managed Tunnel SSH secrets."
          echo "Release: ${{ inputs.release }}"
