name: Staging deploy

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release identifier
        required: true
        type: string
      app:
        description: Frontend site to publish
        required: true
        type: choice
        options: [buyer, merchant, admin]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build staging image
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -eu
          case "$RELEASE" in ''|*[!A-Za-z0-9-]*) echo "release must contain only letters, numbers, and hyphens" >&2; exit 64;; esac
          docker build -f backend/Dockerfile -t "drlife-api:$RELEASE" ./backend
      - name: Validate compose template
        run: STAGING_ENV_FILE=env.example docker compose --env-file deploy/staging/env.example -f deploy/staging/compose.yaml config --quiet
      - name: Validate nginx staging config
        run: ./deploy/staging/test-nginx-config.sh
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7
      - name: Publish through owner-managed SSH
        env:
          RELEASE: ${{ inputs.release }}
          APP: ${{ inputs.app }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$STAGING_SSH_HOST" -a -n "$STAGING_SSH_USER" -a -n "$STAGING_SSH_PRIVATE_KEY" -a -n "$STAGING_SSH_KNOWN_HOSTS"
          case "$APP" in buyer|merchant|admin) ;; *) echo "app must be buyer, merchant, or admin" >&2; exit 64;; esac
          case "$RELEASE" in ''|*[!A-Za-z0-9-]*) echo "release must contain only letters, numbers, and hyphens" >&2; exit 64;; esac
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging_key"
          chmod 600 "$HOME/.ssh/staging_key"
          ssh -i "$HOME/.ssh/staging_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "/usr/local/sbin/drlifeplus-staging-publish '$APP' '$RELEASE'"
